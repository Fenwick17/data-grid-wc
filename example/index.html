<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Components Library — Examples</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Web Components Library</h1>
      <p>Examples and manual testing playground.</p>
    </header>

    <main>
      <!--
        Add a new <section class="example"> for each component.
        The custom element is registered by importing it in ./main.ts.
      -->
      <section class="example">
        <h2>&lt;data-grid&gt;</h2>
        <p>
          Click a cell to focus it, then click again to edit. Use arrow keys or
          Tab to move between cells. Press Enter to edit and Escape to cancel.
          The Actions column opens a menu.
        </p>
        <data-grid></data-grid>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
